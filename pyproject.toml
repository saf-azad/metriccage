[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ufc-fight-predictor"
version = "0.1.0"
description = "Calibrated probabilistic UFC fight outcome predictor."
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
# The article analysis scripts are kept exactly as run for reproducibility.
exclude = ["articles"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "N803",  # ML naming convention: X, X_train etc.
    "N806",  # ML naming convention: X, X_train etc.
]

[tool.ruff.lint.per-file-ignores]
# Runnable entry-point scripts bootstrap sys.path (insert repo root) BEFORE
# importing the local `src` package, so their imports are legitimately not at
# top-of-file. This is the intended pattern for `python scripts/foo.py`.
"scripts/*.py" = ["E402"]
# Per-event one-off predictions and archived/superseded experiments are kept
# runnable and faithful to their original form for reproducibility, not
# maintained to library lint standard. Reproducibility > style for frozen
# historical code. src/ and the canonical top-level scripts stay strict.
"scripts/events/*.py" = ["E402", "E701", "E702", "E741", "B007", "B023", "B905", "F811", "F841", "I001", "UP031"]
"scripts/archive/*.py" = ["E402", "E701", "E702", "E741", "B007", "B023", "B905", "F811", "F841", "I001", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_data: test needs local data/model artifacts (final_model_bundle.pkl + fights parquet); auto-skipped by tests/conftest.py when they are absent",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
